<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">

    <link rel="stylesheet" href="style.css">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background.object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./js/game.js"></script>

</head>

<body onload="init()">

    <div id="fullscreen">
        <h1>El Pollo Loco</h1>

        <button id="fullscreenBtn" class="fullscreen-btn" type="button" title="Toggle fullscreen">⤢</button>
        <button id="muteBtn" class="mute-btn" type="button" title="Mute/unmute">🔊</button>
        <button id="pauseBtn" class="pause-btn" type="button" title="Pause / Resume">⏸</button>

        <div id="gameContainer">
            <div id="startScreen">
                <h2>El Pollo Loco</h2>
                <p>Arrow keys to move • UP to jump • SPACE to throw</p>
                <button id="startBtn">Start Game</button>
            </div>

            <!-- Portrait only mode -->
            <div id="orientationOverlay" aria-live="polite">
                <div class="orientationCard">
                    <h2>Turn your device to play!</h2>
                    <p>This game works in landscape mode only</p>
                </div>
            </div>

            <canvas id="canvas" width="720" height="480"></canvas>
            <!-- Mobile controls -->
            <div id="mobileControls" aria-label="Mobile controls">
                <div class="mc-left">
                    <button class="mc-btn" data-action="LEFT" aria-label="Move left">◀</button>
                    <button class="mc-btn" data-action="RIGHT" aria-label="Move right">▶</button>
                </div>

                <div class="mc-right">
                    <button class="mc-btn" data-action="UP" aria-label="Jump">⤒</button>
                    <button class="mc-btn" data-action="SPACE" aria-label="Throw">⦿</button>
                </div>
            </div>
            <!-- Pause Overlay div -->
            <div id="pauseOverlay" aria-live="polite">
                <div class="pauseCard">
                    <h2>Paused</h2>
                    <p>Press <b>Esc</b>/<b>P</b> or tap the pause button to resume.</p>
                    <button id="resumeBtn" type="button">Resume</button>
                </div>
            </div>


        </div>
    </div>



</body>

</html>
