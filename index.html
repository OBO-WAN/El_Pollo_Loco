<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">

    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Smokum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/theme.css">
    <link rel="stylesheet" href="style/typography.css">
    <link rel="stylesheet" href="style/layout.css">
    <link rel="stylesheet" href="style/widgets.css">
    <link rel="stylesheet" href="style/ui-buttons.css">
    <link rel="stylesheet" href="style/overlays.css">
    <link rel="stylesheet" href="style/desktop.css">
    <link rel="stylesheet" href="style/mobile.css">

    <link rel="manifest" href="manifest.json">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/endboss_attack.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken_big.class.js"></script>
    <script src="./models/chicken_little.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/world_render.class.js"></script>
    <script src="./models/world_audio.class.js"></script>
    <script src="./models/world_collisions.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background.object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <!-- =====================================================
     GAME ASSETS (static configuration)
===================================================== -->
    <script src="./js/assets.js"></script>

    <!-- =====================================================
     CORE STATE
===================================================== -->
    <script src="./js/game_state.js"></script>

    <!-- =====================================================
     INFRASTRUCTURE (rendering, loading, utilities)
===================================================== -->
    <script src="./js/game_preload.js"></script>
    <script src="./js/game_ui_overlays.js"></script>
    <script src="./js/game_render_viewport.js"></script>

    <!-- =====================================================
     SUBSYSTEMS (audio, input, pause, mobile)
===================================================== -->
    <script src="./js/game_audio.js"></script>
    <script src="./js/game_pause.js"></script>
    <script src="./js/game_keyboard.js"></script>
    <script src="./js/game_mobile.js"></script>

    <!-- =====================================================
     APPLICATION LAYER (wiring + boot)
===================================================== -->
    <script src="./js/game_main.js"></script>
    <script src="./js/game_boot.js"></script>

</head>

<body onload="init()">

    <div id="fullscreen">
        <h1 class="title-western animated-title">El Pollo Loco</h1>

        <button id="pauseBtn" class="pause-btn" type="button" title="Pause / Resume">⏸</button>
        <button id="muteBtn" class="mute-btn" type="button" title="Mute/unmute">🔊</button>
        <button id="restartBtn" class="restart-btn" type="button" title="Restart game">⟳</button>

        <div id="gameContainer">
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <p id="loadingText">Loading game… 0%</p>
            </div>

            <div id="startScreen">
                <img src="assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Game"
                    class="start-screen-image" />

                <button id="startBtn" class="start-screen-btn">
                    Start Game
                </button>

                <div class="startScreenActions">
                    <button id="howToBtn" class="mini-action-btn" type="button">How to play</button>
                    <button id="impressumBtnMobile" class="mini-action-btn" type="button">Legal Notice</button>
                </div>
            </div>

            <!-- How-to-play overlay -->
            <div id="howToOverlay" class="uiOverlay" aria-hidden="true">
                <div class="uiCard" role="dialog" aria-modal="true" aria-labelledby="howToTitle">
                    <h2 id="howToTitle">How to play</h2>

                    <div class="howToRows">
                        <div class="howToRow">
                            <span class="key key-move">◀ ▶</span>
                            <span>Move</span>
                        </div>
                        <div class="howToRow">
                            <span class="key key-jump">⤒</span>
                            <span>Jump</span>
                        </div>
                        <div class="howToRow">
                            <span class="key key-throw">⦿</span>
                            <span>Throw</span>
                        </div>
                    </div>

                    <button id="closeHowToBtn" class="start-screen-btn" type="button">OK</button>
                </div>
            </div>

            <!-- Portrait only mode -->
            <div id="orientationOverlay" aria-live="polite">
                <div class="orientationCard">
                    <div class="western-rotate-icon">
                        <svg viewBox="0 0 120 120" class="rotate-svg">
                            <!-- Wood sign background -->
                            <rect x="10" y="30" width="100" height="60" rx="12" fill="#8b5a2b" stroke="#5c3317"
                                stroke-width="6" />

                            <!-- Phone outline -->
                            <rect x="45" y="40" width="30" height="50" rx="6" fill="#f5deb3" stroke="#3e2a14"
                                stroke-width="4" />

                            <!-- Screen -->
                            <rect x="50" y="48" width="20" height="32" rx="3" fill="#2f4f4f" />

                            <!-- Rotate arrow -->
                            <path d="M60 15
             a35 35 0 0 1 35 35" fill="none" stroke="#ffc30d" stroke-width="6" stroke-linecap="round" />

                            <polygon points="90,50 100,45 95,60" fill="#ffc30d" />
                        </svg>
                    </div>
                    <h2>Turn your device to play</h2>
                    <p>This game works in landscape mode only</p>
                </div>
            </div>

            <canvas id="canvas" width="720" height="480"></canvas>

            <button id="fullscreenBtn" class="fullscreen-btn fullscreen-btn-canvas" type="button"
                title="Enter fullscreen">
                ⤢
            </button>
            <!-- Mobile controls -->
            <div id="mobileControls" aria-label="Mobile controls">
                <div class="mc-left">
                    <button oncontextmenu="return false;" class="mc-btn" data-action="LEFT"
                        aria-label="Move left">◀</button>
                    <button oncontextmenu="return false;" class="mc-btn" data-action="RIGHT"
                        aria-label="Move right">▶</button>
                </div>

                <div class="mc-right">
                    <button oncontextmenu="return false;" class="mc-btn" data-action="UP" aria-label="Jump">⤒</button>
                    <button oncontextmenu="return false;" class="mc-btn" data-action="SPACE"
                        aria-label="Throw">⦿</button>
                </div>
            </div>
            <!-- Pause Overlay div -->
            <div id="pauseOverlay" aria-live="polite">
                <div class="pauseCard">
                    <h2>Paused</h2>
                    <p>Press <b>Esc</b>/<b>P</b> or tap the pause button to resume.</p>
                    <button id="resumeBtn" type="button" class="start-screen-btn">
                        Resume
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" style="display:none;">
            <h2 style="color: #ff4343; font-size:64px; margin-bottom:16px;">You Lose</h2>
            <div class="overlayActions">
                <button id="gameOverRestartBtn" class="start-screen-btn">
                    Restart
                </button>
                <button id="gameOverMenuBtn" class="start-screen-btn">
                    Main Menu
                </button>
            </div>
        </div>

        <!-- Win Overlay -->
        <div id="winOverlay" style="display:none;">
            <h2 style="color:#ffc30d; font-size:64px; margin-bottom:16px;">You Win!</h2>
            <div class="overlayActions">
                <button id="winRestartBtn" class="start-screen-btn">
                    Restart
                </button>
                <button id="winMenuBtn" class="start-screen-btn">
                    Main Menu
                </button>
            </div>
        </div>

        <div id="controlsHint">
            <p>
                <span class="key key-move">◀ ▶</span> Move
                <span class="key key-jump">⤒</span> Jump
                <span class="key key-throw">⦿</span> Throw
            </p>
        </div>

        <div id="legalBar">
            <button id="impressumBtn" type="button" class="legal-btn">Legal Notice</button>
        </div>

    </div>

</body>

</html>
